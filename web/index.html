<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>할 일 목록</title>
  <style>
    /* 색은 이 변수 묶음 한 곳에서만 정한다. 강조 초록은 하나(--accent). */
    :root {
      --accent: #047857;
      --accent-soft: #ecfdf5;
      --focus-ring: rgba(16, 185, 129, .45);
      --bg: #f8f9fa;
      --card: #ffffff;
      --ink: #171717;
      --muted: #64748b;
      --line: #e5e7eb;
      --head-bg: #f3f6f5;
      --row-hover: #f6fbf9;
      --error-ink: #b91c1c;
      --error-bg: #fef2f2;
      --error-line: #fecaca;
      --info-ink: #4b5563;
      --info-bg: #f3f4f6;
      --info-line: #e5e7eb;
    }
    /* 다크 모드: 변수만 바꾼다(시스템 설정 또는 data-theme="dark"). */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --accent: #6ee7b7;
        --accent-soft: #123a2f;
        --bg: #111816;
        --card: #18221f;
        --ink: #e5efeb;
        --muted: #94a8a1;
        --line: #2b3a35;
        --head-bg: #1f2c28;
        --row-hover: #1d2a26;
        --error-ink: #fca5a5;
        --error-bg: #3a1a1a;
        --error-line: #7f1d1d;
        --info-ink: #cbd5d1;
        --info-bg: #1f2a27;
        --info-line: #2b3a35;
      }
    }
    :root[data-theme="dark"] {
      --accent: #6ee7b7;
      --accent-soft: #123a2f;
      --bg: #111816;
      --card: #18221f;
      --ink: #e5efeb;
      --muted: #94a8a1;
      --line: #2b3a35;
      --head-bg: #1f2c28;
      --row-hover: #1d2a26;
      --error-ink: #fca5a5;
      --error-bg: #3a1a1a;
      --error-line: #7f1d1d;
      --info-ink: #cbd5d1;
      --info-bg: #1f2a27;
      --info-line: #2b3a35;
    }

    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg); color: var(--ink);
      max-width: 48rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
    }

    .titlebar { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; }
    .titlebar h1 { font-size: 1.5rem; margin: 0; }
    .badge {
      font-size: .8rem; font-weight: 600; color: var(--accent);
      background: var(--accent-soft); border: 1px solid var(--accent);
      border-radius: 999px; padding: .1rem .6rem;
    }

    /* 필터 알약: 호버 시 살짝 진해지고 초록 테두리 */
    .filters { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
    .pill {
      display: inline-flex; align-items: center; gap: .35rem;
      text-decoration: none; color: var(--ink); background: var(--card);
      border: 1px solid var(--line); border-radius: 999px; padding: .25rem .8rem; font-size: .9rem;
      transition: border-color .15s, background-color .15s;
    }
    .pill .count { font-size: .75rem; color: var(--muted); }
    .pill:hover { border-color: var(--accent); background: var(--accent-soft); }
    .pill[aria-current="page"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .pill[aria-current="page"] .count { color: var(--accent); }
    a { color: var(--accent); }
    a:hover { filter: brightness(.9); }
    :focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    button:disabled, [aria-disabled="true"] { cursor: not-allowed; }

    /* 표: 조용한 머리줄(옅은 띠 + 작은 회색 글자), 넉넉한 칸 여백 */
    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .todos { width: 100%; border-collapse: collapse; }
    .todos th {
      background: var(--head-bg); color: var(--muted); font-size: .75rem; font-weight: 600;
      text-align: left; padding: .6rem 1rem; letter-spacing: .02em;
    }
    .todos td { padding: .85rem 1rem; border-top: 1px solid var(--line); vertical-align: top; }
    .todos tbody tr:hover { background: var(--row-hover); }
    .todos .due { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
    .todos .title { overflow-wrap: anywhere; }
    .todos .owner:empty::before { content: "—"; color: var(--muted); }

    .footer { color: var(--muted); font-size: .85rem; text-align: right; margin: .6rem .25rem 0; }

    /* 상태 칸: 오류는 빨강, 빈/불러오는 중은 회색 */
    .state { margin: 0; padding: .75rem 1rem; border-radius: 10px; border: 1px solid; }
    .state.error { color: var(--error-ink); background: var(--error-bg); border-color: var(--error-line); }
    .state.empty, .state.loading { color: var(--info-ink); background: var(--info-bg); border-color: var(--info-line); }

    /* 등장 움직임 260ms, 움직임 줄이기 설정이면 끈다 */
    .table-wrap, .state { animation: rise 260ms ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .table-wrap, .state { animation: none; }
      .pill { transition: none; }
    }

    /* 좁은 화면: 표가 넘치지 않게 */
    @media (max-width: 480px) {
      body { margin: 1rem auto; padding: 0 .75rem; }
      .titlebar h1 { font-size: 1.25rem; }
      .todos th, .todos td { padding: .55rem .6rem; }
      .todos td { font-size: .9rem; }
      .todos .due { white-space: normal; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="./app.js"></script>
</body>
</html>
